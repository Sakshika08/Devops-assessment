apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-assessment-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-assessment-app
  template:
    metadata:
      labels:
        app: my-assessment-app
    spec:
      containers:
        - name: app
          image: :sakshika/my-assessment-app:IMAGE_TAG
